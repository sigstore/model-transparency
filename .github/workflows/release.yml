name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  build_wheel:
    name: Build the wheel
    if: github.repository == 'sigstore/model-transparency'  # Don't do this in forks
    runs-on: ubuntu-latest  # Use matrix when we have OS specific pieces
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Hatch
      uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
    - name: Build artifacts
      run: hatch build
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: dist/
        name: dist.zip
        if-no-files-found: error
        retention-days: 1

  publish_release_to_pypi:
    name: Publish release to PyPI
    needs: [build_wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/model-signing/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist.zip
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build_and_push_container:
    name: Build and Push Docker Image
    needs: [publish_release_to_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        id: registry_login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert tag to version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version=${tag#v}  # Remove leading 'v' prefix
          echo "APP_VERSION=${version}" >> $GITHUB_ENV

      - name: Build minimal image
        id: build_minimal_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          image: sigstore/model-transparency-cli
          tags: "${{ github.event.release.tag_name }}-minimal"
          archs: amd64
          oci: false
          build-args: |
            BUILD_TYPE=minimal
            APP_VERSION=${{ env.APP_VERSION }}

      - id: docker_meta_minimal
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.build_minimal_image.outputs.image }}
          tags: type=sha,format=long,type=ref,event=branch

      - name: Push minimal image to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push_minimal
        with:
          image: ${{ steps.build_minimal_image.outputs.image }}
          tags: ${{ steps.build_minimal_image.outputs.tags }}
          registry: ghcr.io

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sigstore/model-transparency-cli
          subject-digest: ${{ steps.push_minimal.outputs.digest }}
          push-to-registry: true

      - name: Build full image
        id: build_full_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          image: sigstore/model-transparency-cli
          tags: "latest ${{ github.event.release.tag_name }}"
          archs: amd64
          oci: false
          build-args: |
            BUILD_TYPE=full
            APP_VERSION=${{ env.APP_VERSION }}

      - id: docker_meta_full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.build_full_image.outputs.image }}
          tags: type=sha,format=long,type=ref,event=branch

      - name: Push full image to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push_full
        with:
          image: ${{ steps.build_full_image.outputs.image }}
          tags: ${{ steps.build_full_image.outputs.tags }}
          registry: ghcr.io

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sigstore/model-transparency-cli
          subject-digest: ${{ steps.push_full.outputs.digest }}
          push-to-registry: true

  # TODO: Create and publish release notes
  # TODO: Generate SLSA provenance for the wheels
  # TODO: Sign artifacts with sigstore and publish to release page
  # TODO: Build container cli for other platforms
