name: Run cross OS sign and verify
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  generate-model:
    runs-on: ubuntu-latest
    steps:
      - name: generate model
        id: model
        run: |
          set -e
          MODEL_ROOT=$(mktemp --directory)
          echo "root=$MODEL_ROOT" >> "$GITHUB_OUTPUT"
          for i in {0..1}; do
              DIR="${MODEL_ROOT}/d${i}"
              mkdir "$DIR"
              for j in {0..2}; do
                  echo "This is file f${i}${j} in d${i}." > "${DIR}/f${i}${j}"
              done
          done
          for i in {0..3}; do
              echo "This is file f${i} in root." > "${MODEL_ROOT}/f${i}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.model.outputs.root }}
          name: model.zip
          if-no-files-found: error
          retention-days: 1
  model-signing:
    name: Signing with ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    needs: [generate-model]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model.zip
          path: model_root/
      - name: Set up Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Fetch OIDC token
        run: |
          SIGSTORE_ID_TOKEN=$(curl -sSfL https://storage.googleapis.com/sigstore-conformance-testing-token/untrusted-testing-token.txt)
          echo "SIGSTORE_ID_TOKEN=$SIGSTORE_ID_TOKEN" >> "$GITHUB_ENV"
      - name: Sign the model
        run: hatch run python -m model_signing sign sigstore model_root/ --use_staging --signature model.sig --identity_token "${SIGSTORE_ID_TOKEN}"
      - name: upload model signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}-model.sig
          path: model.sig
          if-no-files-found: error
          retention-days: 1
  model-verification:
    name: Verifying with ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    if: ${{ always() }} # don't stop some verification if one of the signing jobs failed
    needs: [generate-model, model-signing]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        signed-with-os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model.zip
          path: model_root/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.signed-with-os }}-model.sig
      - name: Set up Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Verify the model
        run: |
          hatch run python -m model_signing verify sigstore model_root/ --use_staging --signature model.sig \
            --identity "untrusted-sa@sigstore-conformance.iam.gserviceaccount.com" \
            --identity_provider "https://accounts.google.com"
