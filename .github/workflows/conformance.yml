name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  schedule:
    - cron: '0 8 * * 1,4' # Mon/Thu 8 AM UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: OMS conformance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install model-signing from source
        run: pip install .

      - name: Run OMS conformance suite
        uses: ossf/model-signing-spec/conformance@main
        with:
          entrypoint: ${{ github.workspace }}/test/conformance/python-conformance
          xfail: |
            test_verify[negative/certificate-no-code-signing-eku_fail
            test_verify[negative/certificate-not-yet-valid_fail
            test_verify[negative/certificate-expired_fail
            test_verify[negative/certificate-all-expired_fail
            test_verify[negative/certificate-expired-intermediate-expired-leaf_fail
